<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presentasi - IT Helpdesk BVT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Style kustom untuk konten slide */
        .slide-content {
            /* Mencegah pergeseran tata letak saat konten berubah */
            min-height: 0;
            max-height: 100%;
        }
        
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        
        body {
            background-color: #f3f4f6;
        }
        
        main {
            height: 100%;
            overflow-y: auto;
        }
        
        .slide-container-wrapper {
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        
        .slide-content-wrapper {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }
        
        .slide-content {
            overflow-y: auto;
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        
        .nav-footer {
            flex-shrink: 0;
        }
        
        /* Logo di setiap slide */
        .slide-logo {
            position: absolute;
            top: 1rem;
            left: 1rem;
            z-index: 100 !important;
            max-height: 40px;
            width: auto;
            pointer-events: none; /* Prevent logo from blocking clicks */
        }
        
        .slide-content {
            position: relative;
            max-height: 100%;
            overflow-y: auto;
            padding-top: 3rem !important; /* Space for logo (40px logo + padding) */
        }
        
        /* Ensure content fits without scroll */
        .slide-content > * {
            max-width: 100%;
        }
        
        @media (max-width: 640px) {
            .slide-logo {
                max-height: 30px;
                top: 0.5rem;
                left: 0.5rem;
            }
            
            .slide-content {
                padding: 0.75rem !important;
                padding-top: 2.25rem !important; /* Space for smaller logo on mobile */
            }
            
            .slide-content h1 {
                font-size: 1.5rem;
                margin-bottom: 0.5rem;
            }
            
            .slide-content h2 {
                font-size: 1.25rem;
                margin-bottom: 0.5rem;
            }
            
            .slide-content h3 {
                font-size: 1.125rem;
                margin-bottom: 0.5rem;
            }
            
            .slide-content p,
            .slide-content ul {
                font-size: 0.875rem;
                margin-bottom: 0.5rem;
            }
        }
        
        @media (min-width: 641px) and (max-width: 1024px) {
            .slide-content {
                padding: 1rem !important;
                padding-top: 3rem !important; /* Space for logo */
            }
        }
        
        @media (min-width: 1025px) {
            .slide-content {
                padding: 1.5rem !important;
                padding-top: 3rem !important; /* Space for logo */
            }
        }
        
        .slide-content h1 {
            font-size: clamp(1.5rem, 4vw, 2.5rem); /* Responsive: 24px - 40px */
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: #111827; /* gray-900 */
            line-height: 1.2;
        }
        .slide-content h2 {
            font-size: clamp(1.25rem, 3.5vw, 2rem); /* Responsive: 20px - 32px */
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: #1f2937; /* gray-800 */
            line-height: 1.3;
        }
        .slide-content h3 {
            font-size: clamp(1.125rem, 3vw, 1.5rem); /* Responsive: 18px - 24px */
            font-weight: 600;
            margin-bottom: 0.75rem;
            color: #374151; /* gray-700 */
            line-height: 1.4;
        }
        .slide-content p {
            font-size: clamp(0.875rem, 2.5vw, 1rem); /* Responsive: 14px - 16px */
            margin-bottom: 0.5rem;
            color: #374151; /* gray-700 */
            line-height: 1.5;
        }
        .slide-content ul {
            font-size: clamp(0.875rem, 2.5vw, 1rem); /* Responsive: 14px - 16px */
            list-style-position: outside;
            list-style-type: disc;
            margin-left: 1rem;
            margin-bottom: 0.75rem;
            color: #374151; /* gray-700 */
            line-height: 1.5;
        }
        .slide-content li {
            margin-bottom: 0.25rem;
        }
        .slide-content code {
            font-family: monospace;
            background-color: #f3f4f6; /* gray-100 */
            padding: 0.125rem 0.375rem;
            border-radius: 0.25rem;
            font-size: clamp(0.75rem, 2vw, 0.875rem); /* Responsive: 12px - 14px */
        }
        .slide-content table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 0.75rem;
            font-size: clamp(0.75rem, 2vw, 0.875rem); /* Responsive: 12px - 14px */
        }
        .slide-content th, .slide-content td {
            border: 1px solid #d1d5db; /* gray-300 */
            padding: 0.5rem;
            text-align: left;
        }
        .slide-content th {
            background-color: #f9fafb; /* gray-50 */
            font-weight: 600;
        }
        
        /* Reduce padding and margin for boxes inside slides */
        .slide-content .bg-red-100,
        .slide-content .bg-green-100,
        .slide-content .bg-yellow-100,
        .slide-content .bg-blue-50,
        .slide-content .bg-blue-100,
        .slide-content .bg-indigo-50 {
            padding: 0.5rem !important;
            margin-top: 0.5rem !important;
            margin-bottom: 0.5rem !important;
        }
        
        .slide-content .space-y-6 > * {
            margin-top: 0.75rem !important;
            margin-bottom: 0.75rem !important;
        }
        
        .slide-content .space-y-4 > * {
            margin-top: 0.5rem !important;
            margin-bottom: 0.5rem !important;
        }
        
        .slide-content .space-y-3 > * {
            margin-top: 0.375rem !important;
            margin-bottom: 0.375rem !important;
        }
        
        .slide-content .mt-6,
        .slide-content .mt-8 {
            margin-top: 0.75rem !important;
        }
        
        .slide-content .mb-2,
        .slide-content .mb-4,
        .slide-content .mb-6,
        .slide-content .mb-8 {
            margin-bottom: 0.5rem !important;
        }
        
        .slide-content .p-4,
        .slide-content .p-6 {
            padding: 0.5rem !important;
        }
        
        /* Reduce font sizes for specific text classes */
        .slide-content .text-5xl {
            font-size: clamp(1.75rem, 5vw, 2.5rem) !important;
        }
        
        .slide-content .text-3xl {
            font-size: clamp(1.25rem, 4vw, 2rem) !important;
        }
        
        .slide-content .text-xl {
            font-size: clamp(1rem, 3vw, 1.25rem) !important;
        }
        
        .slide-content .text-lg {
            font-size: clamp(0.875rem, 2.5vw, 1rem) !important;
        }
        
        .slide-content .text-base {
            font-size: clamp(0.75rem, 2vw, 0.875rem) !important;
        }
        
        /* Mencegah tombol menjadi terlalu kecil di ponsel */
        .nav-button {
            min-width: 100px;
        }
        
        /* Logo styling di footer */
        .nav-footer img {
            max-height: 32px;
            width: auto;
            object-fit: contain;
        }
        
        @media (max-width: 640px) {
            .nav-footer img {
                max-height: 24px;
            }
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-900 flex flex-col h-full">

    <!-- Slide Container -->
    <main class="flex-grow flex items-center justify-center p-2 sm:p-4">
        <div class="bg-white w-full max-w-5xl shadow-xl rounded-lg overflow-hidden slide-container-wrapper">
            <!-- Language Toggle Button -->
            <div class="bg-indigo-50 border-b border-indigo-200 px-4 py-2 flex justify-end">
                <button id="lang-toggle" class="flex items-center gap-2 px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition duration-150 shadow-sm">
                    <i class="fas fa-language"></i>
                    <span id="lang-text">English</span>
                </button>
            </div>
            
            <!-- Konten Slide (dinamis) -->
            <div id="slide-container" class="slide-content p-3 sm:p-4 md:p-6 slide-content-wrapper">
                <!-- Konten slide akan dimuat di sini oleh JS -->
            </div>

            <!-- Navigasi -->
            <footer class="bg-gray-50 border-t border-gray-200 px-3 py-2 sm:px-4 sm:py-3 nav-footer">
                <div class="flex justify-between items-center">
                    <button id="prev-btn" class="nav-button bg-gray-600 text-white px-4 py-2 rounded-md shadow-sm hover:bg-gray-700 disabled:opacity-50 disabled:cursor-not-allowed transition duration-150">
                        <span id="prev-text">Sebelumnya</span>
                    </button>
                    
                    <span id="slide-counter" class="text-sm font-medium text-gray-600">
                        Slide 1 / 16
                    </span>
                    
                    <button id="next-btn" class="nav-button bg-blue-600 text-white px-4 py-2 rounded-md shadow-sm hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed transition duration-150">
                        <span id="next-text">Berikutnya</span>
                    </button>
                </div>
            </footer>
        </div>
    </main>

    <script>
        // Language management
        let currentLang = localStorage.getItem('panduan-lang') || 'id'; // Default: Indonesian
        
        // Language texts
        const langTexts = {

        ];

        // Get current slides based on language
        function getCurrentSlides() {
            return currentLang === 'id' ? slidesID : slidesEN;
        }

        // Initialize variables
        let currentSlide = 0;
        let slideContainer, slideCounter, prevButton, nextButton, langToggle, langText, prevText, nextText;
        
        // Wait for DOM to be ready
        function initElements() {
            slideContainer = document.getElementById('slide-container');
            slideCounter = document.getElementById('slide-counter');
            prevButton = document.getElementById('prev-btn');
            nextButton = document.getElementById('next-btn');
            langToggle = document.getElementById('lang-toggle');
            langText = document.getElementById('lang-text');
            prevText = document.getElementById('prev-text');
            nextText = document.getElementById('next-text');
            
            if (!slideContainer || !slideCounter || !prevButton || !nextButton || !langToggle) {
                console.error('Required elements not found');
                return false;
            }
            return true;
        }

        // Update UI language
        function updateUILanguage() {
            const texts = langTexts[currentLang];
            langText.textContent = texts.langToggle;
            prevText.textContent = texts.prev;
            nextText.textContent = texts.next;
        }

        // Switch language
        function switchLanguage() {
            currentLang = currentLang === 'id' ? 'en' : 'id';
            localStorage.setItem('panduan-lang', currentLang);
            updateUILanguage();
            renderSlide();
        }

        function renderSlide() {
            const slides = getCurrentSlides();
            // Memperbarui konten slide
            slideContainer.innerHTML = slides[currentSlide];
            
            // Memperbarui penghitung slide
            const texts = langTexts[currentLang];
            slideCounter.textContent = `${texts.slide} ${currentSlide + 1} / ${slides.length}`;

            // Mengatur status tombol
            prevButton.disabled = (currentSlide === 0);
            nextButton.disabled = (currentSlide === slides.length - 1);
        }

        // Initialize everything after DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initializeApp);
        } else {
            initializeApp();
        }
        
        function initializeApp() {
            if (!initElements()) {
                console.error('Failed to initialize elements');
                return;
            }
            
            // Set up event listeners
            langToggle.addEventListener('click', switchLanguage);
            
            prevButton.addEventListener('click', () => {
                if (currentSlide > 0) {
                    currentSlide--;
                    renderSlide();
                }
            });

            nextButton.addEventListener('click', () => {
                try {
                    const slides = getCurrentSlides();
                    if (!slides || !Array.isArray(slides)) {
                        console.error('Slides array is not available');
                        return;
                    }
                    const maxSlide = slides.length - 1;
                    if (currentSlide < maxSlide) {
                        currentSlide++;
                        renderSlide();
                    }
                } catch (error) {
                    console.error('Error in next button:', error);
                }
            });
            
            // Initialize UI
            updateUILanguage();
            renderSlide();
        }
        
        // Fungsi untuk menutup panduan dan kembali ke dashboard
        function closePanduan() {
            // Cek apakah ini di dalam iframe
            if (window.self !== window.top) {
                // Jika di dalam iframe, kirim pesan ke parent untuk switch ke tab Dashboard
                try {
                    window.parent.postMessage({ action: 'closePanduan' }, '*');
                } catch (e) {
                    console.error('Error sending message to parent:', e);
                }
            } else {
                // Jika tidak di iframe, redirect ke dashboard
                window.location.href = '../index.php';
            }
        }
        
        // Event listener untuk tombol close menggunakan event delegation
        document.addEventListener('click', (e) => {
            if (e.target.id === 'close-panduan-btn' || e.target.closest('#close-panduan-btn')) {
                e.preventDefault();
                closePanduan();
            }
        });
        
        // Listen for messages from parent to reset slide
        window.addEventListener('message', (event) => {
            // Accept messages from same origin (security)
            if (event.data && event.data.action === 'resetSlide') {
                // Reset to first slide
                if (typeof currentSlide !== 'undefined') {
                    currentSlide = 0;
                    if (typeof renderSlide === 'function') {
                        renderSlide();
                    }
                }
            }
        });
        
        // Reset slide when page becomes visible (when tab is opened)
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden && typeof currentSlide !== 'undefined' && currentSlide !== 0) {
                // Only reset if not already on first slide
                currentSlide = 0;
                if (typeof renderSlide === 'function') {
                    renderSlide();
                }
            }
        });

    </script>
